# Режим розробки з hot-reload: код із хоста прокидається в контейнер (bind mount),
# і сервер перезапускається при кожній зміні файлів — без перезбирання образу.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

# Окрема назва проєкту: власні контейнери і власний том БД, тож дані розробки не змішуються з production
name: vet-crm-dev

services:
  app:
    image: vet-crm:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment:
      APP_ENV: sandbox
      DEBUG: "true"
      DOCS_ENABLED: "true"
      # Опитування файлів замість подій ФС — надійно працює з bind mount на macOS і Windows
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
