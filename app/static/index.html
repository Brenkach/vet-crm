<body>
  <script src="app.js"></script>
  <script>
    // Точка входу: залогінений — у свій кабінет, інакше — на вхід
    (async () => {
      if (!getToken()) { location.replace("login.html"); return; }
      try {
        const me = await api("/users/me");
        location.replace(homeFor(me.role));
      } catch (e) {
        logout();
      }
    })();
  </script>
</body>
