# Оркестрація Vet CRM: Nginx (балансувальник) → кілька реплік застосунку → PostgreSQL.
#
#   docker compose up --build              — зібрати образи і підняти всю систему
#   docker compose up -d --scale app=5     — змінити кількість реплік без зміни файлу
#   docker compose down                    — зупинити (дані БД зберігаються в томі postgres_data)
#   docker compose down -v                 — зупинити і ВИДАЛИТИ дані БД
#
# Змінні оточення беруться з файлу .env (створюється командою: python scripts/init_env.py).

name: vet-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Задайте POSTGRES_USER у файлі .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у файлі .env}
      POSTGRES_DB: ${POSTGRES_DB:-vet_crm}
    volumes:
      # Іменований том: дані переживають зупинку і видалення контейнера
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    # Порт БД назовні не відкривається — до неї мають доступ лише репліки застосунку
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: runtime
    image: vet-crm:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Значення з .env; з терміналу можна перевизначити: APP_ENV=sandbox docker compose up
      APP_ENV: ${APP_ENV:-production}
      # Адреса БД складається зі змінних .env; "db" — ім'я сервісу у внутрішній мережі Docker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vet_crm}
      # Схему БД створюють міграції Alembic (docker/entrypoint.sh), а не застосунок
      AUTO_CREATE_TABLES: "false"
    deploy:
      # Горизонтальне масштабування: кілька однакових реплік за балансувальником
      replicas: ${APP_REPLICAS:-3}
    # Портів назовні немає: усі запити приходять через Nginx
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  nginx:
    build: ./nginx
    image: vet-crm-nginx:latest
    restart: unless-stopped
    environment:
      LB_ALGORITHM: ${LB_ALGORITHM:-round_robin}
    ports:
      # Єдина точка входу в систему
      - "${HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  # Внутрішня мережа без виходу в інтернет: Nginx, репліки застосунку і БД
  backend:
    internal: true
  # Мережа для публікації порту Nginx на хост
  frontend:

volumes:
  postgres_data:
